<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading Analyzer</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --up:#26a69a; --down:#ef5350; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 12px 0 0; letter-spacing:.4px; }
  select,button { background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 10px; }
  .price { font-size:20px; font-weight:600; }
  .badge { padding:4px 12px; border-radius:999px; font-weight:700; letter-spacing:.5px; }
  .badge.BUY { background:#122; color:var(--up); border:1px solid var(--up); }
  .badge.SELL { background:#211; color:var(--down); border:1px solid var(--down); }
  .badge.NEUTRAL { background:#222; color:var(--dim); border:1px solid var(--border); }
  main { display:grid; grid-template-columns:1fr 300px; gap:12px; padding:12px; }
  #chart { width:100%; height:460px; background:var(--panel); border:1px solid var(--border); border-radius:8px; }
  #side { display:flex; flex-direction:column; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; }
  .panel h2 { font-size:12px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  #rsiChart,#macdChart { width:100%; height:120px; }
  .reason { color:var(--dim); font-size:13px; }
  @media (max-width:800px){ main{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>Trading Analyzer</h1>
  <select id="symbol">
    <option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option>
    <option>BNBUSDT</option><option>XRPUSDT</option><option>DOGEUSDT</option>
  </select>
  <select id="interval">
    <option value="1m">1m</option><option value="5m">5m</option>
    <option value="15m">15m</option><option value="1h" selected>1h</option>
    <option value="4h">4h</option><option value="1d">1d</option>
  </select>
  <button id="refresh">Refresh</button>
  <span id="price" class="price">—</span>
  <span id="signal" class="badge NEUTRAL">NEUTRAL</span>
  <span id="reason" class="reason"></span>
</header>
<main>
  <div id="chart"></div>
  <div id="side">
    <div class="panel"><h2>RSI (14)</h2><div id="rsiChart"></div></div>
    <div class="panel"><h2>MACD Histogram</h2><div id="macdChart"></div></div>
  </div>
</main>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{ background:{color:'transparent'}, textColor:'#8b949e' },
  grid:{ vertLines:{color:'#21262d'}, horzLines:{color:'#21262d'} },
  rightPriceScale:{ borderColor:'#30363d' }, timeScale:{ borderColor:'#30363d' },
});
const candles = chart.addCandlestickSeries({ upColor:'#26a69a', downColor:'#ef5350', wickUpColor:'#26a69a', wickDownColor:'#ef5350' });
const volume = chart.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'' });
const ema20 = chart.addLineSeries({ color:'#f0b90b', lineWidth:2 });
const ema50 = chart.addLineSeries({ color:'#e91e63', lineWidth:2 });
chart.priceScale('').applyOptions({ scaleMargins:{ top:0.8, bottom:0 } });

const mkChart = id => LightweightCharts.createChart(document.getElementById(id), {
  layout:{ background:{color:'transparent'}, textColor:'#8b949e' },
  grid:{ vertLines:{color:'#21262d'}, horzLines:{color:'#21262d' }},
  timeScale:{ visible:false }, rightPriceScale:{ borderColor:'#30363d' }, height:120,
});
const rsiChart = mkChart('rsiChart');
const macdChart = mkChart('macdChart');
const rsiLine = rsiChart.addLineSeries({ color:'#f0b90b', lineWidth:2 });
rsiLine.createPriceLine({ price:70, color:'#ef5350', lineStyle:2 });
rsiLine.createPriceLine({ price:30, color:'#26a69a', lineStyle:2 });
const macdBars = macdChart.addHistogramSeries({ priceFormat:{type:'price'}, base:0 });

async function load(){
  const symbol = document.getElementById('symbol').value;
  const interval = document.getElementById('interval').value;
  const res = await fetch(`/api/klines?symbol=${symbol}&interval=${interval}&limit=300`);
  const d = await res.json();
  candles.setData(d.candles);
  volume.setData(d.volume);
  ema20.setData(d.ema20.filter(p=>p.value!=null));
  ema50.setData(d.ema50.filter(p=>p.value!=null));
  rsiLine.setData(d.rsi.filter(p=>p.value!=null));
  macdBars.setData(d.candles.slice(d.candles.length-d.macd_hist.length).map((c,i)=>({
    time:c.time, value:d.macd_hist[i], color:d.macd_hist[i]>=0?'#26a69a':'#ef5350',
  })));
  document.getElementById('price').textContent = '$' + d.price.toLocaleString();
  const sig = d.signal;
  const badge = document.getElementById('signal');
  badge.textContent = sig.action; badge.className = 'badge ' + sig.action;
  document.getElementById('reason').textContent = sig.reason;
  chart.timeScale().fitContent();
}
document.getElementById('refresh').onclick = load;
document.getElementById('symbol').onchange = load;
document.getElementById('interval').onchange = load;
load();
setInterval(load, 30000);
</script>
</body>
</html>
